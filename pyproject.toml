[project]
name = "private-note"
version = "0.1.2"
description = "Local RAG note system"
requires-python = ">=3.10"
dependencies = [
    "chromadb==1.5.5",
    "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller==6.19.0",
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
