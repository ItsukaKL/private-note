<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Note</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #111827;
        --panel-2: #0f172a;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --border: #1f2937;
        --bubble: #1f2937;
        --bubble-user: #0f766e;
        --status-bg: rgba(15, 23, 42, 0.9);
        --status-border: #1f2937;
        --input-bg: #0b1220;
      }
      body[data-theme="light"] {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --text: #0f172a;
        --muted: #475569;
        --accent: #16a34a;
        --border: #e2e8f0;
        --bubble: #e2e8f0;
        --bubble-user: #38bdf8;
        --status-bg: rgba(255, 255, 255, 0.95);
        --status-border: #e2e8f0;
        --input-bg: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .layout {
        display: flex;
        height: 100vh;
      }
      .layout.resizing {
        cursor: col-resize;
        user-select: none;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        width: 320px;
        min-width: 220px;
        max-width: 520px;
      }
      .divider-vertical {
        width: 6px;
        cursor: col-resize;
        background: transparent;
      }
      .divider-vertical.active {
        background: var(--border);
      }
      .divider-vertical:hover {
        background: var(--border);
      }
      .sidebar-header {
        padding: 20px 16px;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .add-note {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .notes {
        overflow: auto;
        padding: 0 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .note-item {
        padding: 10px 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .note-preview {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: pre-wrap;
      }
      .note-meta {
        font-size: 11px;
        color: var(--muted);
      }
      .note-item.active {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35);
      }
      .note-actions {
        display: flex;
        gap: 8px;
      }
      .note-actions button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .note-actions button.delete {
        border-color: #7f1d1d;
        color: #fecaca;
      }
      .note-actions button.edit {
        border-color: #1d4ed8;
        color: #bfdbfe;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .modal.hidden {
        display: none;
      }
      .modal-card {
        width: 360px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .modal-text {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 16px;
        white-space: pre-wrap;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .modal-actions button {
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        padding: 8px 16px;
        cursor: pointer;
      }
      .modal-actions button.danger {
        background: #dc2626;
        border-color: #dc2626;
        color: #fef2f2;
      }
      .main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .chat-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .header-actions {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      .theme-toggle {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 10px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .theme-toggle svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .trash-toggle {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 10px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .trash-toggle svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .chat-body {
        flex: 1;
        overflow: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 160px;
      }
      .message {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 70%;
      }
      .message.user {
        align-self: flex-end;
      }
      .bubble {
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--bubble);
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .message.user .bubble {
        background: var(--bubble-user);
      }
      .bubble-text {
        white-space: pre-wrap;
      }
      .message-meta {
        font-size: 11px;
        color: var(--muted);
      }
      .message.user .message-meta {
        text-align: right;
      }
      .composer {
        border-top: 1px solid var(--border);
        padding: 16px 24px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        background: var(--panel);
        min-height: 120px;
        align-items: stretch;
      }
      .divider-horizontal {
        height: 10px;
        cursor: row-resize;
        background: transparent;
      }
      .divider-horizontal:hover {
        background: var(--border);
      }
      .divider-horizontal.active {
        background: var(--border);
      }
      .composer textarea {
        width: 100%;
        min-height: 64px;
        resize: none;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 12px;
        font-size: 14px;
        height: 100%;
      }
      .composer button {
        background: #2563eb;
        border: none;
        color: #f8fafc;
        font-weight: 600;
        padding: 0 16px;
        border-radius: 10px;
        cursor: pointer;
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .composer button svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .editor-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        z-index: 30;
      }
      .editor-overlay.hidden {
        display: none;
      }
      .editor-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .editor-title {
        font-size: 16px;
        font-weight: 600;
      }
      .editor-actions {
        display: flex;
        gap: 10px;
      }
      .editor-actions button {
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        padding: 8px 16px;
        cursor: pointer;
      }
      .editor-actions button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #f8fafc;
      }
      .editor-actions button.danger {
        background: #dc2626;
        border-color: #dc2626;
        color: #fef2f2;
      }
      .editor-body {
        flex: 1;
        padding: 24px;
      }
      .editor-body textarea {
        width: 100%;
        height: 100%;
        resize: none;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        padding: 16px;
        font-size: 15px;
        line-height: 1.6;
      }
      .status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font-size: 12px;
        color: var(--text);
        background: var(--status-bg);
        border: 1px solid var(--status-border);
        padding: 8px 12px;
        border-radius: 10px;
        max-width: 320px;
        z-index: 15;
        transition: opacity 0.15s ease, visibility 0.15s ease;
      }
      .status.hidden {
        opacity: 0;
        visibility: hidden;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .bubble {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>我的笔记</span>
          <button class="add-note" id="addNote">新增</button>
        </div>
        <div class="notes" id="notesList"></div>
      </aside>
      <div class="divider-vertical" id="sidebarDivider"></div>
      <main class="main">
        <div class="chat-header">
          <span>基于笔记的问答</span>
          <div class="header-actions">
            <button class="trash-toggle" id="chatClear" aria-label="清空聊天记录">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M6 6l1 14h10l1-14"></path>
              </svg>
            </button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换模式">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 14.5a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="status hidden" id="statusText"></div>
        <section class="chat-body" id="chatBody"></section>
        <div class="divider-horizontal" id="composerDivider"></div>
        <section class="composer">
          <textarea id="questionInput" placeholder="输入问题，基于笔记回答"></textarea>
          <button id="sendQuestion" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"></path>
              <path d="M5 12l7-7 7 7"></path>
            </svg>
          </button>
        </section>
      </main>
    </div>
    <div class="editor-overlay hidden" id="editorOverlay">
      <div class="editor-header">
        <div class="editor-title" id="editorTitle">新增笔记</div>
        <div class="editor-actions">
          <button id="editorBack">返回</button>
          <button class="danger" id="editorClear">清空</button>
          <button class="primary" id="editorSave">保存</button>
        </div>
      </div>
      <div class="editor-body">
        <textarea id="editorInput" placeholder="输入笔记内容，保存后会自动向量化"></textarea>
      </div>
    </div>
    <div class="modal hidden" id="clearModal">
      <div class="modal-card">
        <div class="modal-title">确认清空</div>
        <div class="modal-text">确定要清空当前输入内容吗？</div>
        <div class="modal-actions">
          <button id="clearCancel">取消</button>
          <button class="danger" id="clearConfirm">清空</button>
        </div>
      </div>
    </div>
    <div class="modal hidden" id="confirmModal">
      <div class="modal-card">
        <div class="modal-title">确认删除</div>
        <div class="modal-text" id="confirmText">确定要删除这条笔记吗？</div>
        <div class="modal-actions">
          <button id="confirmCancel">取消</button>
          <button class="danger" id="confirmDelete">删除</button>
        </div>
      </div>
    </div>
    <div class="modal hidden" id="chatClearModal">
      <div class="modal-card">
        <div class="modal-title">确认清空聊天记录</div>
        <div class="modal-text">确定要清空当前聊天记录吗？</div>
        <div class="modal-actions">
          <button id="chatClearCancel">取消</button>
          <button class="danger" id="chatClearConfirm">清空</button>
        </div>
      </div>
    </div>
    <script>
      const notesList = document.getElementById("notesList");
      const addNote = document.getElementById("addNote");
      const chatBody = document.getElementById("chatBody");
      const questionInput = document.getElementById("questionInput");
      const sendQuestion = document.getElementById("sendQuestion");
      const statusText = document.getElementById("statusText");
      const themeToggle = document.getElementById("themeToggle");
      const chatClear = document.getElementById("chatClear");
      const confirmModal = document.getElementById("confirmModal");
      const confirmText = document.getElementById("confirmText");
      const confirmCancel = document.getElementById("confirmCancel");
      const confirmDelete = document.getElementById("confirmDelete");
      const editorOverlay = document.getElementById("editorOverlay");
      const editorTitle = document.getElementById("editorTitle");
      const editorInput = document.getElementById("editorInput");
      const editorSave = document.getElementById("editorSave");
      const editorClear = document.getElementById("editorClear");
      const editorBack = document.getElementById("editorBack");
      const clearModal = document.getElementById("clearModal");
      const clearCancel = document.getElementById("clearCancel");
      const clearConfirm = document.getElementById("clearConfirm");
      const chatClearModal = document.getElementById("chatClearModal");
      const chatClearCancel = document.getElementById("chatClearCancel");
      const chatClearConfirm = document.getElementById("chatClearConfirm");
      const layout = document.querySelector(".layout");
      const sidebar = document.querySelector(".sidebar");
      const sidebarDivider = document.getElementById("sidebarDivider");
      const composer = document.querySelector(".composer");
      const composerDivider = document.getElementById("composerDivider");
      let editingId = null;
      let pendingDeleteId = null;
      const chatStorageKey = "chat_history_v1";
      const legacyChatKey = "chat_history";

      const addBubble = (text, isUser, meta) => {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${isUser ? "user" : ""}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const body = document.createElement("div");
        body.className = "bubble-text";
        body.textContent = text;
        const metaLine = document.createElement("div");
        metaLine.className = "message-meta";
        metaLine.textContent = meta || "";
        bubble.appendChild(body);
        wrapper.appendChild(bubble);
        wrapper.appendChild(metaLine);
        chatBody.appendChild(wrapper);
        chatBody.scrollTop = chatBody.scrollHeight;
      };

      const setStatus = (text) => {
        statusText.textContent = text;
        if (text) {
          statusText.classList.remove("hidden");
        } else {
          statusText.classList.add("hidden");
        }
      };
      const formatTime = (iso) => {
        if (!iso) {
          return "";
        }
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) {
          return iso;
        }
        const pad = (value) => String(value).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      };
      const nowIso = () => new Date().toISOString();
      const saveChat = (items) => {
        localStorage.setItem(chatStorageKey, JSON.stringify(items));
      };
      const loadChat = () => {
        const raw = localStorage.getItem(chatStorageKey);
        if (!raw) {
          const legacy = localStorage.getItem(legacyChatKey);
          if (!legacy) {
            return [];
          }
          try {
            const parsed = JSON.parse(legacy);
            const items = Array.isArray(parsed) ? parsed : [];
            saveChat(items);
            return items;
          } catch {
            return [];
          }
        }
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      };
      const appendChat = (entry) => {
        const items = loadChat();
        items.push(entry);
        saveChat(items);
      };
      const renderChat = () => {
        chatBody.innerHTML = "";
        loadChat().forEach((item) => {
          const meta = item.role === "assistant"
            ? `${formatTime(item.time)} · ${item.model || "未知模型"}`
            : formatTime(item.time);
          addBubble(item.text, item.role === "user", meta);
        });
      };
      const setTheme = (theme) => {
        document.body.dataset.theme = theme;
        localStorage.setItem("theme", theme);
      };
      const setThemeIcon = (theme) => {
        if (theme === "light") {
          themeToggle.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>';
        } else {
          themeToggle.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z"></path></svg>';
        }
      };
      const initTheme = () => {
        const saved = localStorage.getItem("theme");
        if (saved) {
          setTheme(saved);
          setThemeIcon(saved);
          return;
        }
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        const initial = prefersLight ? "light" : "dark";
        setTheme(initial);
        setThemeIcon(initial);
      };

      const loadNotes = async () => {
        const res = await fetch("/notes");
        const data = await res.json();
        notesList.innerHTML = "";
        data.forEach((note) => {
          const item = document.createElement("div");
          item.className = "note-item";
          const content = document.createElement("div");
          content.className = "note-preview";
          content.textContent = note.content;
          const meta = document.createElement("div");
          meta.className = "note-meta";
          meta.textContent = `更新时间 ${formatTime(note.created_at) || "未知"}`;
          const actions = document.createElement("div");
          actions.className = "note-actions";
          const editBtn = document.createElement("button");
          editBtn.className = "edit";
          editBtn.textContent = "编辑";
          editBtn.addEventListener("click", () => {
            editingId = note.id;
            editorInput.value = note.content;
            editorTitle.textContent = `编辑笔记 #${note.id}`;
            editorOverlay.classList.remove("hidden");
            const updatedAt = formatTime(note.created_at);
            setStatus(`正在编辑 #${note.id} · 上次修改 ${updatedAt || "未知"}`);
            document.querySelectorAll(".note-item").forEach((el) => el.classList.remove("active"));
            item.classList.add("active");
          });
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete";
          deleteBtn.textContent = "删除";
          deleteBtn.addEventListener("click", async () => {
            pendingDeleteId = note.id;
            const preview = note.content.length > 60 ? `${note.content.slice(0, 60)}...` : note.content;
            confirmText.textContent = `确定要删除这条笔记吗？\n${preview}`;
            confirmModal.classList.remove("hidden");
          });
          actions.appendChild(editBtn);
          actions.appendChild(deleteBtn);
          item.appendChild(content);
          item.appendChild(meta);
          item.appendChild(actions);
          notesList.appendChild(item);
        });
      };

      const openNewEditor = () => {
        editingId = null;
        editorTitle.textContent = "新增笔记";
        editorInput.value = "";
        editorOverlay.classList.remove("hidden");
      };

      addNote.addEventListener("click", () => {
        openNewEditor();
      });

      editorSave.addEventListener("click", async () => {
        const content = editorInput.value.trim();
        if (!content) {
          setStatus("请输入笔记内容");
          return;
        }
        setStatus(editingId ? "正在更新并向量化..." : "正在写入并向量化...");
        const url = editingId ? `/note/${editingId}` : "/note";
        const method = editingId ? "PUT" : "POST";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content }),
        });
        if (res.ok) {
          editingId = null;
          setStatus("笔记已保存");
          document.querySelectorAll(".note-item").forEach((el) => el.classList.remove("active"));
          editorOverlay.classList.add("hidden");
          await loadNotes();
        } else {
          setStatus("写入失败，请检查 Ollama 服务");
        }
      });

      editorBack.addEventListener("click", () => {
        editorOverlay.classList.add("hidden");
      });

      editorClear.addEventListener("click", () => {
        clearModal.classList.remove("hidden");
      });

      clearCancel.addEventListener("click", () => {
        clearModal.classList.add("hidden");
      });

      clearModal.addEventListener("click", (event) => {
        if (event.target === clearModal) {
          clearModal.classList.add("hidden");
        }
      });

      clearConfirm.addEventListener("click", () => {
        editorInput.value = "";
        clearModal.classList.add("hidden");
      });
      chatClear.addEventListener("click", () => {
        chatClearModal.classList.remove("hidden");
      });
      chatClearCancel.addEventListener("click", () => {
        chatClearModal.classList.add("hidden");
      });
      chatClearModal.addEventListener("click", (event) => {
        if (event.target === chatClearModal) {
          chatClearModal.classList.add("hidden");
        }
      });
      chatClearConfirm.addEventListener("click", () => {
        localStorage.removeItem(chatStorageKey);
        localStorage.removeItem(legacyChatKey);
        renderChat();
        chatClearModal.classList.add("hidden");
        setStatus("聊天记录已清空");
      });
      themeToggle.addEventListener("click", () => {
        const next = document.body.dataset.theme === "light" ? "dark" : "light";
        setTheme(next);
        setThemeIcon(next);
      });

      const attachVerticalResize = () => {
        let startX = 0;
        let startWidth = 0;
        const onMove = (event) => {
          const delta = event.clientX - startX;
          const next = Math.min(520, Math.max(220, startWidth + delta));
          sidebar.style.width = `${next}px`;
        };
        const onUp = () => {
          layout.classList.remove("resizing");
          sidebarDivider.classList.remove("active");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        };
        sidebarDivider.addEventListener("mousedown", (event) => {
          startX = event.clientX;
          startWidth = sidebar.getBoundingClientRect().width;
          layout.classList.add("resizing");
          sidebarDivider.classList.add("active");
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      };

      const attachHorizontalResize = (divider, target, minHeight) => {
        let startY = 0;
        let startHeight = 0;
        const onMove = (event) => {
          const delta = event.clientY - startY;
          const next = Math.max(minHeight, startHeight + delta);
          target.style.height = `${next}px`;
          target.style.flex = "none";
        };
        const onUp = () => {
          divider.classList.remove("active");
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        };
        divider.addEventListener("mousedown", (event) => {
          startY = event.clientY;
          startHeight = target.getBoundingClientRect().height;
          divider.classList.add("active");
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      };

      confirmCancel.addEventListener("click", () => {
        pendingDeleteId = null;
        confirmModal.classList.add("hidden");
      });

      confirmModal.addEventListener("click", (event) => {
        if (event.target === confirmModal) {
          pendingDeleteId = null;
          confirmModal.classList.add("hidden");
        }
      });

      confirmDelete.addEventListener("click", async () => {
        if (pendingDeleteId === null) {
          confirmModal.classList.add("hidden");
          return;
        }
        const res = await fetch(`/note/${pendingDeleteId}`, { method: "DELETE" });
        if (res.ok) {
          if (editingId === pendingDeleteId) {
            editingId = null;
            editorOverlay.classList.add("hidden");
            document.querySelectorAll(".note-item").forEach((el) => el.classList.remove("active"));
          }
          await loadNotes();
          setStatus("笔记已删除");
        } else {
          setStatus("删除失败，请稍后再试");
        }
        pendingDeleteId = null;
        confirmModal.classList.add("hidden");
      });

      sendQuestion.addEventListener("click", async () => {
        const question = questionInput.value.trim();
        if (!question) {
          setStatus("请输入问题");
          return;
        }
        const sentAt = nowIso();
        addBubble(question, true, formatTime(sentAt));
        appendChat({ role: "user", text: question, time: sentAt });
        questionInput.value = "";
        setStatus("正在检索并回答...");
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (res.ok) {
          const data = await res.json();
          const replyAt = nowIso();
          const modelName = data.model || "未知模型";
          addBubble(data.answer, false, `${formatTime(replyAt)} · ${modelName}`);
          appendChat({ role: "assistant", text: data.answer, time: replyAt, model: modelName });
          setStatus("");
        } else {
          setStatus("回答失败，请检查 Ollama 服务");
        }
      });

      initTheme();
      loadNotes();
      renderChat();
      attachVerticalResize();
      attachHorizontalResize(composerDivider, chatBody, 160);
    </script>
  </body>
</html>
